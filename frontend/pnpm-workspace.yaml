allowBuilds:
  sharp: false
  unrs-resolver: false
  # Binaire fourni par le paquet de plateforme (@esbuild/<os>-<arch>) : le script n'est pas nécessaire.
  esbuild: false
  # Idem (@swc/core-<os>-<arch>), tiré par @serwist/turbopack (ADR 0015).
  "@swc/core": false

# Défense supply chain : aucune version publiée depuis moins de 24 h n'est installée
# (laisse le temps aux registres de retirer une version compromise). Pas d'exception.
minimumReleaseAge: 1440
