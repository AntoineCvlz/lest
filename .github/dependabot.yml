# Mises à jour de dépendances : hebdomadaires, groupées, avec un délai de 3 jours après
# publication (cohérent avec `minimumReleaseAge` de pnpm : défense supply chain).
# Messages au format Conventional Commits : `chore(deps): …`.
version: 2

updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 3 }
    commit-message: { prefix: chore, include: scope }
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 3 }
    commit-message: { prefix: chore, include: scope }
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 3 }
    commit-message: { prefix: chore, include: scope }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 3 }
    commit-message: { prefix: chore, include: scope }

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 3 }
    commit-message: { prefix: chore, include: scope }
    groups:
      actions:
        patterns: ["*"]
