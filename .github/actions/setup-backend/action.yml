name: Setup backend
description: uv + Python (version de backend/.python-version) + dépendances verrouillées, avec cache.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: "0.13.5"
        working-directory: backend
        enable-cache: true
        cache-dependency-glob: backend/uv.lock
    - name: Install dependencies
      shell: bash
      working-directory: backend
      run: uv sync --frozen
