name: Setup backend
description: uv + Python (version de backend/.python-version) + dépendances verrouillées, avec cache.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.5"
        working-directory: backend
        enable-cache: true
        cache-dependency-glob: backend/uv.lock
    - name: Install dependencies
      shell: bash
      working-directory: backend
      run: uv sync --frozen
