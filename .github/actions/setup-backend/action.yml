name: Setup backend
description: uv + Python (version de backend/.python-version) + dépendances verrouillées, avec cache.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: "0.13.5"
        working-directory: backend
        enable-cache: true
        cache-dependency-glob: backend/uv.lock
    - name: Install dependencies
      shell: bash
      working-directory: backend
      run: uv sync --frozen
