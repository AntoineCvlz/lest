name: Tests front

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vitest-build:
    name: Vitest + build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Vitest
        working-directory: frontend
        run: pnpm test
      - name: Client API à jour (drift du client TypeScript)
        working-directory: frontend
        run: |
          pnpm typegen
          git diff --exit-code -- src/shared/api/schema.d.ts \
            || { echo "::error::schema.d.ts est obsolète : lancer \`just typegen\`"; exit 1; }
      - name: Build
        working-directory: frontend
        run: pnpm build
