name: E2E + a11y

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playwright:
    name: Playwright + axe (stack Compose, images de prod)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configuration de la stack (secrets éphémères)
        run: |
          cp .env.example .env
          sed -i "s|^DJANGO_SECRET_KEY=.*|DJANGO_SECRET_KEY=$(openssl rand -base64 48 | tr -d '\n/+=')|" .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
      - name: Démarrage de la stack
        run: docker compose -f compose.yaml -f compose.e2e.yaml up --build --detach --wait --wait-timeout 300
      - uses: ./.github/actions/setup-frontend
      # Image officielle (navigateurs et dépendances système préinstallés) : évite
      # `playwright install --with-deps`, dont l'apt-get a pris plus de 10 min sur le runner.
      # Version identique à @playwright/test (package.json) ; image épinglée par digest.
      - name: Playwright (mobile + desktop)
        working-directory: frontend
        run: |
          docker run --rm --network host --ipc host \
            --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI=true \
            -e E2E_BASE_URL=http://localhost:3000 \
            -v "$PWD:/work" -w /work \
            mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea \
            node_modules/.bin/playwright test
      - name: Journaux de la stack
        if: failure()
        run: docker compose -f compose.yaml -f compose.e2e.yaml logs --no-color
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
      - name: Arrêt de la stack
        if: always()
        run: docker compose -f compose.yaml -f compose.e2e.yaml down --volumes
