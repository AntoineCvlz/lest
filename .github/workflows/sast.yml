name: SAST

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    name: Semgrep (bloquant sur ERROR)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep (règles default + OWASP Top 10)
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af \
            semgrep scan --config p/default --config p/owasp-top-ten \
              --severity ERROR --error --metrics off --disable-version-check

  bandit:
    name: Bandit (bloquant sur sévérité haute)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      # Les règles Bandit tournent déjà dans ruff (S) à chaque lint ; ce job applique
      # l'outil de référence avec un seuil explicite.
      - name: Bandit
        run: >-
          uvx bandit==1.9.4 --recursive backend
          --exclude backend/.venv,backend/common/tests,backend/common/health/tests,backend/config/tests
          --severity-level high --confidence-level medium
